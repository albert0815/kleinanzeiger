services:
  kleinanzeigen-agent:
    build:
      context: .
      cache_from:
        - type=local,src=/opt/buildkit-cache/kleinanzeigen-agent
      cache_to:
        - type=local,dest=/opt/buildkit-cache/kleinanzeigen-agent,mode=max
    container_name: kleinanzeigen-agent
    restart: unless-stopped
    # Reaps the Chromium processes the bot leaves behind as zombies.
    init: true
    env_file:
      - .env
    environment:
      UV_NO_CACHE: "1"
    shm_size: '256m'
    security_opt:
      - seccomp:unconfined
    volumes:
      # per-user kleinanzeigen config dirs (config.yaml + ads/)
      - /docker-volumes/kleinanzeiger/kleinanzeigen-config:/docker-volumes/kleinanzeiger/kleinanzeigen-config
    # "web" is the network Mahlino is on as well. Mahlino reaches the recipe
    # import endpoint (recipe_import_api.py) there as
    # http://kleinanzeigen-agent:8090, so no port is published on the host.
    networks:
      - default
      - web

networks:
  web:
    external: true
